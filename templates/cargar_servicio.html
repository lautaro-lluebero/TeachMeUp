<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cargar Servicio</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/formularios.css') }}"
    />
  </head>
  <body>
    <div class="cargar-servicio">
      <div class="form-box">
        <h2>{% if servicio %}Actualizar Servicio{% else %}Cargar Servicio{% endif %}</h2>

        <form method="POST" action="{{ url_for('routes_profesores.cargar_servicio') }}">
          <div class="form-group">
            <label for="nombre_profesor">Nombre del Profesor</label>
            <input
              type="text"
              id="nombre_profesor"
              name="nombre_profesor"
              placeholder="Ej: Juan Pérez"
              value="{{ servicio.nombre_profesor if servicio else session['username'] }}"
              required
            />
          </div>

          <div class="form-group">
            <label for="categoria">Materia / Categoría</label>
            <input
              type="text"
              id="categoria"
              name="categoria"
              placeholder="Ej: Matemática"
              value="{{ servicio.categoria if servicio else '' }}"
              required
            />
          </div>

          <div class="form-group">
            <label for="descripcion">Descripción</label>
            <textarea
              id="descripcion"
              name="descripcion"
              placeholder="Describe brevemente el servicio..."
              required
            >{{ servicio.descripcion if servicio else '' }}</textarea>
          </div>

          <div class="form-group">
            <label for="modalidad">Modalidad</label>
            <select id="modalidad" name="modalidad" required>
              <option value="" disabled {% if not servicio %}selected{% endif %}>
                Seleccionar...
              </option>
              <option value="presencial" {% if servicio and servicio.modalidad == 'presencial' %}selected{% endif %}>Presencial</option>
              <option value="virtual" {% if servicio and servicio.modalidad == 'virtual' %}selected{% endif %}>Virtual</option>
              <option value="mixta" {% if servicio and servicio.modalidad == 'mixta' %}selected{% endif %}>Mixta</option>
            </select>
          </div>

          <div class="form-group">
            <label for="direccion">Dirección</label>
            <input
              type="text"
              id="direccion"
              name="direccion"
              placeholder="Ej: Calle Falsa 123"
              value="{{ servicio.direccion if servicio else '' }}"
            />
          </div>

          <div class="form-group">
            <label for="precio_por_hora">Precio por hora</label>
            <input
              type="number"
              id="precio_por_hora"
              name="precio_por_hora"
              placeholder="Ej: 1500"
              value="{{ servicio.precio_por_hora if servicio else '' }}"
              required
            />
          </div>

          <button type="submit" class="btn-form">
            {% if servicio %}Actualizar Servicio{% else %}Cargar Servicio{% endif %}
          </button>
        </form>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert alert-{{ category }}">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}
      </div>
    </div>
  </body>
</html>
