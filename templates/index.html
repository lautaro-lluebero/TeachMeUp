<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>TeachMeUp</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
  </head>
  <body class="inicio-body">
    <!-- Mensajes Flash -->
    {% with messages = get_flashed_messages(with_categories=true) %} {% if
    messages %}
    <div class="perfil-alerts">
      {% for category, message in messages %}
      <div class="alert alert-{{ category }}">{{ message }}</div>
      {% endfor %}
    </div>
    {% endif %} {% endwith %}
    <div class="inicio-container">
      <div class="inicio-izquierda">
        <!-- Logo arriba izquierda -->
        <img
          src="{{ url_for('static', filename='img/logoTeachMeUp.png') }}"
          alt="TeachMeUp Logo"
          class="logo-superior"
        />

        <!-- Contenido principal -->
        <div class="contenido-central">
          <h1>Bienvenido a <span class="azul">TeachMeUp</span></h1>
          <h3>¡Tu lugar indicado para formarte!</h3>

          <div class="botones">
            <a class="btn-inicio" href="{{ url_for('routes_auth.registro') }}"
              >Crear cuenta</a
            >
            <a class="btn-inicio" href="{{ url_for('routes_auth.login') }}"
              >Iniciar sesión</a
            >
          </div>
        </div>
      </div>

      <div class="inicio-derecha">
        <img
          src="{{ url_for('static', filename='img/portada.png') }}"
          alt="Clases online"
          class="imagen-derecha"
        />
      </div>
    </div>
    <!-- Logica para que desaparezcan los mensajes flash -->
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const alerts = document.querySelectorAll(".alert");
        alerts.forEach((alert) => {
          setTimeout(() => {
            alert.style.opacity = "0";
            setTimeout(() => alert.remove(), 1000);
          }, 4000);
        });
      });
    </script>
  </body>
</html>
