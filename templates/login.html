<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Iniciar sesión | TeachMeUp</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/formularios.css') }}"
    />
  </head>
  <body>
    <div class="form-container">
      <form
        action="{{ url_for('routes_auth.login') }}"
        method="POST"
        class="form-box"
      >
        <h2>Iniciar sesión</h2>

        <label for="email">Correo electrónico</label>
        <input type="email" id="email" name="email" required />

        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" required />

        <button type="submit" class="btn-form">Iniciar</button>

        <p class="nota">
          Vamos a compartir tu nombre. Nunca envíes tus contraseñas.<br />
          Obtené más información sobre cómo gestionamos tus datos personales.
        </p>
      </form>
    </div>
  </body>
</html>
